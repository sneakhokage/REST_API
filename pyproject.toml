[project]
name = "rest-api"
version = "0.2.0"
description = "Library REST API with MongoDB and FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.134.0",
    "uvicorn>=0.41.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "motor>=3.7.1",
    "pydantic-mongo>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "asyncio>=4.0.0",
    "redis>=7.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
