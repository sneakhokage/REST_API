[project]
name = "rest-api"
version = "0.2.0"
description = "Library REST API with PostgreSQL and SQLAlchemy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.134.0",
    "uvicorn>=0.41.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
